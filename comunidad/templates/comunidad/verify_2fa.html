{% extends 'comunidad/base.html' %}

{% block extra_style %}
<style>
    .auth-wrap { min-height: 60vh; display: flex; align-items: center; }
    .auth-card {
        background: var(--bg-alt); border: 1px solid var(--line); border-radius: 12px; padding: 2.5rem;
    }
    .auth-tag {
        font-family: 'JetBrains Mono', monospace; font-weight: 600; text-transform: uppercase;
        letter-spacing: 3px; font-size: 0.7rem; color: var(--accent); text-align: center; margin-bottom: 0.5rem;
    }
    .auth-tag::before { content: '// '; color: var(--line); }
    .auth-title {
        font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--paper);
        text-align: center; margin-bottom: 1.75rem;
    }
    .auth-form .field-group { margin-bottom: 1.25rem; }
    .auth-form label {
        display: block; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
        letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem;
    }
    .auth-form input {
        width: 100%; background: var(--bg-alt-2); border: 1px solid var(--line-soft); color: var(--paper);
        border-radius: 6px; padding: 0.7rem 0.9rem; font-size: 1.1rem; letter-spacing: 4px; text-align: center;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .auth-form input:focus {
        background: var(--bg-alt-2); color: var(--paper); border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft); outline: none;
    }
    .btn-auth {
        width: 100%; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 0.9rem;
        background: var(--accent); border: 1px solid var(--accent); color: var(--bg);
        border-radius: 3px; padding: 0.8rem; margin-top: 0.5rem; transition: background 0.2s ease, transform 0.2s ease;
    }
    .btn-auth:hover { background: #c8672f; color: var(--bg); transform: translateY(-2px); }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center auth-wrap">
    <div class="col-md-5">
        <div class="auth-card">
            <p class="auth-tag">verificación</p>
            <h3 class="auth-title"><i class="bi bi-phone me-2"></i>Código 2FA</h3>

            <p class="text-center" style="color: var(--ink); font-size: 0.9rem; margin-bottom: 1.5rem;">
                Abre tu app de autenticación e ingresa el código de 6 dígitos.
            </p>

            <form method="POST" class="auth-form" novalidate>
                {% csrf_token %}
                <div class="field-group">
                    <label for="code">Código de verificación</label>
                    <input type="text" name="code" id="code" maxlength="6" pattern="[0-9]{6}"
                           inputmode="numeric" autocomplete="one-time-code" required
                           placeholder="000000" autofocus>
                </div>
                <button type="submit" class="btn-auth">Verificar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
