<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Acceso bloqueado temporalmente</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F6F7F9; color: #3B4557; font-family: system-ui, sans-serif; line-height: 1.6; padding: 1.5rem; }
        main { max-width: 34rem; }
        h1 { color: #1C2433; font-size: 1.75rem; line-height: 1.2; margin: 0 0 1rem; }
        a { color: #A8325A; }
    </style>
</head>
<body>
    <main>
        <h1>Acceso bloqueado por 15 minutos</h1>
        <p>Hubo demasiados intentos fallidos de inicio de sesión. Espera 15 minutos y vuelve a intentarlo.</p>
        <p><a href="/">Volver al inicio</a></p>
    </main>
</body>
</html>
